<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرابط العجيب PRO</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --primary: #6366f1; --accent: #f59e0b; --success: #10b981; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 800px; margin: auto; }
        .hidden { display: none !important; }
        
        /* البطاقات وتنسيقها */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin: 15px 0; }
        .card { padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .selected { border-color: var(--accent) !important; color: var(--accent); background: rgba(245,158,11,0.1); transform: scale(1.05); }
        .correct-card { border-color: var(--success) !important; background: rgba(16,185,129,0.2) !important; box-shadow: 0 0 15px var(--success); }

        /* شريط اللاعبين */
        #player-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 15px 0; }
        .p-tag { background: var(--card-bg); padding: 6px 15px; border-radius: 20px; border: 1px solid #333; display: flex; align-items: center; gap: 8px; }
        .p-score { background: var(--primary); color: white; padding: 1px 7px; border-radius: 6px; font-weight: bold; font-size: 0.8em; }

        /* عناصر التحكم */
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        input, select { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; text-align: center; }
        
        /* أنيميشن التنبيه */
        #result-overlay { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 15px 30px; border-radius: 50px; font-weight: 900; z-index: 100; animation: slideDown 0.5s ease-out; }
        @keyframes slideDown { from { top: -100px; } to { top: 20%; } }
    </style>
</head>
<body>

<div class="container">
    <div id="result-overlay" class="hidden">الإجابة صحيحة! 🎉</div>

    <div id="room-header" class="hidden" style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--card-bg); border-radius:12px; margin-bottom:15px;">
        <div>كود: <b id="room-code-val" style="color:var(--accent)">---</b></div>
        <button onclick="localStorage.removeItem('game_room_id'); location.reload();" style="background:#ef4444; padding:5px 10px; font-size:0.8em;">خروج</button>
    </div>

    <!-- شاشة الدخول -->
    <div id="name-screen">
        <h1>الرابط العجيب 🔥</h1>
        <input type="text" id="nick" placeholder="اسمك المستعار..."><br><br>
        <button onclick="createRoom()" style="background:var(--accent)">إنشاء غرفة</button>
        <button onclick="showJoin()">انضمام برمز</button>
        <div id="join-box" class="hidden" style="margin-top:15px;">
            <input type="text" id="room-id-input" placeholder="الكود..."><button onclick="joinByCode()">دخول</button>
        </div>
    </div>

    <!-- شاشة اللوبي (الهوست) -->
    <div id="lobby-screen" class="hidden">
        <div id="player-list"></div>
        <div id="host-controls" class="hidden" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin-top: 15px;">
            <h3>إعدادات اللعبة (للمضيف)</h3>
            <label>النمط:</label>
            <select id="g-mode" onchange="toggleMode()">
                <option value="ROUNDS">جولات</option>
                <option value="POINTS">نقاط</option>
            </select>
            <span id="rounds-opt"> <label>العدد:</label> <select id="g-rounds"><option value="5">5</option><option value="10">10</option></select> </span>
            <span id="points-opt" class="hidden"> <label>الهدف:</label> <select id="g-points"><option value="50">50</option><option value="100">100</option></select> </span>
            <br><br><button onclick="startGame()">ابدأ اللعبة 🚀</button>
        </div>
        <p id="wait-msg">بانتظار المضيف لضبط الإعدادات...</p>
    </div>

    <!-- شاشة الجيم -->
    <div id="game-screen" class="hidden">
        <div id="game-info" style="font-size:0.8em; opacity:0.6; margin-bottom:5px;"></div>
        <div id="clue-area" style="font-size:1.3em; color:var(--accent); margin-bottom:15px;"></div>
        <div class="grid" id="grid"></div>
        <div id="action-area">
            <div id="drawer-in" class="hidden"><input type="text" id="clue-val" placeholder="اكتب الرابط..."><button onclick="sendAction('submitClue')">إرسال</button></div>
            <div id="fake-in" class="hidden"><button onclick="sendAction('submitFake')" style="background:var(--accent)">تأكيد التضليل</button></div>
            <div id="vote-in" class="hidden"><button onclick="sendAction('submitVote')">تصويت نهائي</button></div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let myId = localStorage.getItem('game_user_id') || ('u_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('game_user_id', myId);
    let currentRoomId = localStorage.getItem('game_room_id') || "", myName = localStorage.getItem('game_user_name') || "";
    let selected = [], isDrawer = false;

    window.onload = () => { if(currentRoomId && myName) join(myName, currentRoomId); };

    function toggleMode() {
        const m = document.getElementById('g-mode').value;
        document.getElementById('rounds-opt').classList.toggle('hidden', m !== 'ROUNDS');
        document.getElementById('points-opt').classList.toggle('hidden', m !== 'POINTS');
    }

    function createRoom() { const n = document.getElementById('nick').value; if(n) join(n, Math.random().toString(36).substr(2, 5).toUpperCase()); }
    function showJoin() { document.getElementById('join-box').classList.toggle('hidden'); }
    function joinByCode() { const n = document.getElementById('nick').value, c = document.getElementById('room-id-input').value.toUpperCase(); if(n && c) join(n, c); }

    function join(name, roomId) {
        currentRoomId = roomId; localStorage.setItem('game_room_id', roomId); localStorage.setItem('game_user_name', name);
        socket.emit('joinGame', { userId: myId, name, roomId });
        document.getElementById('name-screen').classList.add('hidden');
        document.getElementById('room-header').classList.remove('hidden');
        document.getElementById('room-code-val').innerText = roomId;
        document.getElementById('lobby-screen').classList.remove('hidden');
    }

    socket.on('updatePlayerList', d => {
        document.getElementById('player-list').innerHTML = d.players.map(id => `<div class="p-tag" style="opacity:${d.onlinePlayers.includes(id)?1:0.4}">${d.playerNames[id]} <span class="p-score">${d.scores[id]}</span></div>`).join("");
        if(myId === d.hostId) { document.getElementById('host-controls').classList.remove('hidden'); document.getElementById('wait-msg').classList.add('hidden'); }
    });

    socket.on('roundStarted', d => {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        isDrawer = (myId === d.drawerId); selected = [];
        document.getElementById('game-info').innerText = d.gameMode === "ROUNDS" ? `جولة: ${d.currentRound}/${d.totalRounds}` : `الهدف: ${d.targetScore}`;
        document.getElementById('clue-area').innerText = isDrawer ? "أنت المشفر: اختر كلمتين واكتب الرابط" : "المشفر يفكر في رابط...";
        document.getElementById('drawer-in').className = isDrawer ? "" : "hidden";
        document.getElementById('fake-in').className = "hidden"; document.getElementById('vote-in').className = "hidden";
        renderCards(d.words, 2);
    });

    socket.on('showClue', d => {
        document.getElementById('clue-area').innerHTML = `الرابط: <b>${d.clue}</b><br><small>${isDrawer ? "اللاعبون يضللون..." : "اختر كلمتين للتضليل!"}</small>`;
        if(!isDrawer && d.state === "FAKING") document.getElementById('fake-in').classList.remove('hidden');
    });

    socket.on('startVoting', d => {
        document.getElementById('clue-area').innerText = isDrawer ? "اللاعبون يصوتون..." : "اختر الإجابة الصحيحة!";
        document.getElementById('fake-in').className = "hidden";
        if(!isDrawer) {
            document.getElementById('vote-in').classList.remove('hidden');
            const grid = document.getElementById('grid'); grid.innerHTML = "";
            d.options.forEach(pair => {
                const div = document.createElement('div'); div.className = 'card'; div.innerText = pair.join(" + ");
                div.onclick = () => { document.querySelectorAll('.card').forEach(c => c.classList.remove('selected')); div.classList.add('selected'); selected = pair; };
                grid.appendChild(div);
            });
        }
    });

    socket.on('roundFinished', d => {
        const correctStr = d.correctWords.join(" + ");
        document.querySelectorAll('.card').forEach(c => { if(c.innerText === correctStr) c.classList.add('correct-card'); });
        const overlay = document.getElementById('result-overlay');
        overlay.classList.remove('hidden'); overlay.innerText = "انتهت الجولة! الكلمات: " + correctStr;
        setTimeout(() => overlay.classList.add('hidden'), 5000);
    });

    function renderCards(words, limit) {
        const grid = document.getElementById('grid'); grid.innerHTML = "";
        words.forEach(w => {
            const div = document.createElement('div'); div.className = 'card'; div.innerText = w;
            div.onclick = () => {
                if(div.classList.contains('selected')) { div.classList.remove('selected'); selected = selected.filter(s => s !== w); }
                else if(selected.length < limit) { div.classList.add('selected'); selected.push(w); }
            };
            grid.appendChild(div);
        });
    }

    function startGame() { 
        socket.emit('requestStart', { mode: document.getElementById('g-mode').value, rounds: document.getElementById('g-rounds').value, points: document.getElementById('g-points').value }); 
    }

    function sendAction(type) {
        if(selected.length !== 2) return alert("اختر كلمتين!");
        if(type === 'submitClue') {
            const val = document.getElementById('clue-val').value; if(!val) return alert("اكتب الرابط!");
            socket.emit('submitClue', { words: selected, clue: val });
            document.getElementById('drawer-in').classList.add('hidden');
        } else {
            socket.emit(type, selected);
            document.getElementById(type === 'submitFake' ? 'fake-in' : 'vote-in').classList.add('hidden');
        }
        selected = [];
    }
</script>
</body>
</html>
