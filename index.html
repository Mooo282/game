<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرابط العجيب PRO</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --primary: #6366f1; --accent: #f59e0b; --chaos: #ef4444; --text: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; overflow-x: hidden; }
        .container { max-width: 800px; margin: auto; }
        
        /* هيدر الغرفة الذكي */
        #room-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--card-bg); border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        #mobile-room-icon { display: none; cursor: pointer; font-size: 1.2em; background: var(--accent); padding: 5px 10px; border-radius: 8px; }

        /* التصميم المطور للبطاقات */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin: 20px 0; }
        .card { padding: 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; cursor: pointer; text-align: center; transition: 0.3s; backdrop-filter: blur(5px); font-weight: bold; }
        .card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.08); border-color: var(--primary); }
        .selected { border-color: var(--accent) !important; color: var(--accent); background: rgba(245,158,11,0.1) !important; box-shadow: 0 0 15px rgba(245,158,11,0.3); transform: scale(1.05); }

        .hidden { display: none !important; }
        button { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        input { padding: 12px; background: #000; color: #fff; border: 1px solid #333; border-radius: 10px; width: 80%; max-width: 300px; text-align: center; }

        @media (max-width: 600px) {
            #room-display { display: none; }
            #mobile-room-icon { display: block; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="room-header" class="hidden">
        <div id="room-display">كود الغرفة: <b id="room-code-val" style="color:var(--accent); letter-spacing: 2px;">---</b> <button onclick="copyCode()" style="padding:4px 8px; font-size:0.7em; margin-right:10px;">نسخ</button></div>
        <div id="mobile-room-icon" onclick="alert('كود الغرفة: ' + currentRoomId)">🔑 كود الغرفة</div>
        <div id="status">🟢 متصل</div>
    </div>

    <div id="name-screen" style="text-align: center; margin-top: 60px;">
        <h1 style="font-size: 2.5em; margin-bottom: 10px;">الرابط العجيب 🔥</h1>
        <p style="opacity: 0.7; margin-bottom: 30px;">لعبة الذكاء والروابط الجماعية</p>
        <input type="text" id="nick" placeholder="ادخل اسمك المستعار..."><br><br>
        <button onclick="createRoom()" style="background:var(--accent); width: 200px; margin-bottom: 10px;">إنشاء غرفة جديدة</button><br>
        <button onclick="showJoin()" style="width: 200px; background: transparent; border: 1px solid var(--primary);">انضمام لصديق</button>
        <div id="join-box" class="hidden" style="margin-top:20px;">
            <input type="text" id="room-id-input" placeholder="اكتب كود الغرفة هنا..."><br><br>
            <button onclick="joinByCode()">دخول الآن</button>
        </div>
    </div>

    <div id="lobby-screen" class="hidden" style="text-align: center;">
        <h2>قائمة اللاعبين 👥</h2>
        <div id="player-list" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0;"></div>
        <div id="host-tools" class="hidden">
            <button onclick="startGame()">ابدأ اللعبة 🚀</button>
        </div>
        <p id="wait-msg" style="color: var(--accent);">بانتظار المضيف لبدء الجولة...</p>
    </div>

    <div id="game-screen" class="hidden">
        <div id="clue-area" style="font-size: 1.5em; text-align: center; margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px;"></div>
        <div class="grid" id="grid"></div>
        <div id="action-area" style="text-align:center;">
            <div id="drawer-inputs" class="hidden">
                <input type="text" id="clue-in" placeholder="اكتب الرابط المشترك..."><br><br>
                <button onclick="sendClue()">إرسال الرابط</button>
            </div>
            <div id="voter-inputs" class="hidden">
                <button onclick="sendVote()" style="background: var(--accent);">تأكيد التصويت</button>
            </div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let myId = 'u_' + Math.random().toString(36).substr(2, 9);
    let currentRoomId = "", selected = [], isDrawer = false;

    function createRoom() {
        const n = document.getElementById('nick').value; if(!n) return alert("اكتب اسمك!");
        join(n, Math.random().toString(36).substr(2, 5).toUpperCase());
    }
    function showJoin() { document.getElementById('join-box').classList.toggle('hidden'); }
    function joinByCode() {
        const n = document.getElementById('nick').value;
        const c = document.getElementById('room-id-input').value.trim().toUpperCase();
        if(n && c) join(n, c); else alert("أكمل البيانات!");
    }
    function copyCode() { navigator.clipboard.writeText(currentRoomId); alert("تم النسخ!"); }

    function join(name, roomId) {
        currentRoomId = roomId;
        socket.emit('joinGame', { userId: myId, name, roomId });
        document.getElementById('name-screen').classList.add('hidden');
        document.getElementById('room-header').classList.remove('hidden');
        document.getElementById('room-code-val').innerText = roomId;
        document.getElementById('lobby-screen').classList.remove('hidden');
    }

    socket.on('updatePlayerList', d => {
        const list = document.getElementById('player-list');
        list.innerHTML = d.players.map(id => `<div style="background:var(--card-bg); padding:10px 20px; border-radius:10px; border:1px solid ${d.onlinePlayers.includes(id)?'#10b981':'#333'}">${d.playerNames[id]} <span style="color:var(--accent)">[${d.scores[id]}]</span></div>`).join("");
        if(myId === d.hostId) document.getElementById('host-tools').classList.remove('hidden');
    });

    socket.on('roundStarted', d => {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        isDrawer = (myId === d.drawerId); selected = [];
        document.getElementById('clue-area').innerHTML = isDrawer ? "أنت المشفر: اختر كلمتين واكتب الرابط" : `بانتظار المشفر <b style="color:var(--accent)">${d.drawerName}</b>...`;
        document.getElementById('drawer-inputs').className = isDrawer ? "" : "hidden";
        document.getElementById('voter-inputs').className = "hidden";
        renderCards(d.words);
    });

    socket.on('showClue', d => {
        document.getElementById('clue-area').innerHTML = `الرابط: <b style="color:var(--accent)">${d.clue}</b><br><small>اختر الكلمات الصحيحة!</small>`;
        if(!isDrawer) document.getElementById('voter-inputs').classList.remove('hidden');
        selected = [];
        document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    });

    socket.on('roundFinished', d => {
        alert("انتهت الجولة! الكلمات الصحيحة كانت: " + d.correctWords.join(" + "));
    });

    function renderCards(words) {
        const grid = document.getElementById('grid'); grid.innerHTML = "";
        words.forEach(w => {
            const div = document.createElement('div'); div.className = 'card'; div.innerText = w;
            div.onclick = () => {
                if(div.classList.contains('selected')) {
                    div.classList.remove('selected');
                    selected = selected.filter(s => s !== w);
                } else if(selected.length < 2) {
                    div.classList.add('selected');
                    selected.push(w);
                }
            };
            grid.appendChild(div);
        });
    }

    function startGame() { socket.emit('requestStart', { rounds: 5 }); }
    function sendClue() {
        const clue = document.getElementById('clue-in').value;
        if(selected.length !== 2 || !clue) return alert("اختر كلمتين واكتب الرابط!");
        socket.emit('submitClue', { words: selected, clue });
        document.getElementById('drawer-inputs').classList.add('hidden');
    }
    function sendVote() {
        if(selected.length !== 2) return alert("يجب اختيار كلمتين!");
        socket.emit('submitVote', selected);
        document.getElementById('voter-inputs').classList.add('hidden');
    }
</script>
</body>
</html>
