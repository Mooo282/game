<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرابط العجيب - برو</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --primary: #6366f1; --accent: #f59e0b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin: 20px 0; }
        .card { padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; cursor: pointer; font-weight: bold; }
        .selected { border-color: var(--accent) !important; color: var(--accent); background: rgba(245,158,11,0.1); }
        .hidden { display: none !important; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        input { padding: 10px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; width: 80%; max-width: 250px; text-align: center; }
    </style>
</head>
<body>

<div id="room-header" class="hidden" style="display:flex; justify-content:space-between; padding:10px; background:var(--card-bg); border-radius:10px; margin-bottom:15px;">
    <div>كود الغرفة: <b id="room-code-val" style="color:var(--accent)">---</b></div>
    <button onclick="localStorage.removeItem('game_room_id'); location.reload();" style="background:#ef4444; padding:5px 10px; font-size:0.8em;">خروج</button>
</div>

<div id="name-screen">
    <h1>الرابط العجيب 🔥</h1>
    <input type="text" id="nick" placeholder="اسمك المستعار..."><br><br>
    <button onclick="createRoom()" style="background:var(--accent)">إنشاء غرفة</button>
    <button onclick="showJoin()">انضمام</button>
    <div id="join-box" class="hidden" style="margin-top:15px;">
        <input type="text" id="room-id-input" placeholder="الكود..."><button onclick="joinByCode()">دخول</button>
    </div>
</div>

<div id="lobby-screen" class="hidden">
    <h3>اللاعبون المتصلون</h3>
    <div id="player-list" style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:20px;"></div>
    <div id="host-tools" class="hidden"><button onclick="socket.emit('requestStart', {rounds:5})">ابدأ اللعبة 🚀</button></div>
</div>

<div id="game-screen" class="hidden">
    <div id="clue-area" style="font-size:1.2em; margin-bottom:15px; color:var(--accent)"></div>
    <div class="grid" id="grid"></div>
    <div id="action-area">
        <div id="drawer-inputs" class="hidden"><input type="text" id="clue-in" placeholder="الرابط..."><button onclick="sendAction('submitClue')">إرسال</button></div>
        <div id="fake-inputs" class="hidden"><button onclick="sendAction('submitFake')" style="background:var(--accent)">تأكيد التضليل</button></div>
        <div id="vote-inputs" class="hidden"><button onclick="sendAction('submitVote')">تصويت نهائي</button></div>
    </div>
</div>

<script>
    const socket = io();
    let myId = localStorage.getItem('game_user_id') || ('u_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('game_user_id', myId);
    let currentRoomId = localStorage.getItem('game_room_id') || "", myName = localStorage.getItem('game_user_name') || "";
    let selected = [], isDrawer = false;

    window.onload = () => { if(currentRoomId && myName) join(myName, currentRoomId); };

    function createRoom() { const n = document.getElementById('nick').value; if(n) join(n, Math.random().toString(36).substr(2, 5).toUpperCase()); }
    function showJoin() { document.getElementById('join-box').classList.toggle('hidden'); }
    function joinByCode() { const n = document.getElementById('nick').value, c = document.getElementById('room-id-input').value.toUpperCase(); if(n && c) join(n, c); }

    function join(name, roomId) {
        currentRoomId = roomId; localStorage.setItem('game_room_id', roomId); localStorage.setItem('game_user_name', name);
        socket.emit('joinGame', { userId: myId, name, roomId });
        document.getElementById('name-screen').classList.add('hidden');
        document.getElementById('room-header').classList.remove('hidden');
        document.getElementById('room-code-val').innerText = roomId;
        document.getElementById('lobby-screen').classList.remove('hidden');
    }

    socket.on('updatePlayerList', d => {
        document.getElementById('player-list').innerHTML = d.players.map(id => `<div style="background:var(--card-bg); padding:5px 15px; border-radius:20px; border:1px solid ${d.onlinePlayers.includes(id)?'#10b981':'#333'}">${d.playerNames[id]} [${d.scores[id]}]</div>`).join("");
        if(myId === d.hostId) document.getElementById('host-tools').classList.remove('hidden');
    });

    socket.on('roundStarted', d => {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        isDrawer = (myId === d.drawerId); selected = [];
        document.getElementById('clue-area').innerText = isDrawer ? "أنت المشفر: اختر كلمتين واكتب الرابط" : "بانتظار المشفر...";
        document.getElementById('drawer-inputs').className = isDrawer ? "" : "hidden";
        document.getElementById('fake-inputs').className = "hidden";
        document.getElementById('vote-inputs').className = "hidden";
        renderCards(d.words, 2);
    });

    socket.on('showClue', d => {
        document.getElementById('clue-area').innerHTML = `الرابط: <b>${d.clue}</b><br>${isDrawer ? "اللاعبون يضللون..." : "اختر كلمتين للتضليل!"}`;
        if(!isDrawer) {
            document.getElementById('fake-inputs').classList.remove('hidden');
            renderCards(d.pWords, 2);
        }
    });

    socket.on('startVoting', d => {
        document.getElementById('clue-area').innerText = isDrawer ? "اللاعبون يصوتون..." : "اختر الإجابة الصحيحة!";
        document.getElementById('fake-inputs').className = "hidden";
        if(!isDrawer) {
            document.getElementById('vote-inputs').classList.remove('hidden');
            const grid = document.getElementById('grid'); grid.innerHTML = "";
            d.options.forEach(pair => {
                const div = document.createElement('div'); div.className = 'card'; div.innerText = pair.join(" + ");
                div.onclick = () => { document.querySelectorAll('.card').forEach(c => c.classList.remove('selected')); div.classList.add('selected'); selected = pair; };
                grid.appendChild(div);
            });
        }
    });

    socket.on('roundFinished', d => { alert("انتهت الجولة! الكلمات: " + d.correctWords.join(" + ")); });

    function renderCards(words, limit) {
        const grid = document.getElementById('grid'); grid.innerHTML = "";
        words.forEach(w => {
            const div = document.createElement('div'); div.className = 'card'; div.innerText = w;
            div.onclick = () => {
                if(div.classList.contains('selected')) { div.classList.remove('selected'); selected = selected.filter(s => s !== w); }
                else if(selected.length < limit) { div.classList.add('selected'); selected.push(w); }
            };
            grid.appendChild(div);
        });
    }

    function sendAction(type) {
        if(selected.length !== 2) return alert("اختر كلمتين!");
        if(type === 'submitClue') {
            const c = document.getElementById('clue-in').value; if(!c) return alert("اكتب الرابط!");
            socket.emit('submitClue', { words: selected, clue: c });
            document.getElementById('drawer-inputs').classList.add('hidden');
        } else {
            socket.emit(type, selected);
            document.getElementById(type === 'submitFake' ? 'fake-inputs' : 'vote-inputs').classList.add('hidden');
        }
        selected = [];
    }
</script>
</body>
</html>
